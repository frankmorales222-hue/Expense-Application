<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FM Finance</title><link rel="stylesheet" href="/static/styles.css"></head><body>
<div class="app"><aside><div class="brand"><div class="logo">FM</div><div><b>FM Finance</b><span>Smart Books</span></div></div><nav id="nav"></nav><div class="sidefoot"><span>Demo company</span><b>FM Finance Demo</b></div></aside><main><header><div><h1 id="title">Dashboard</h1><p id="subtitle">Your financial position at a glance.</p></div><button class="primary" onclick="showAdd()">+ Add transaction</button></header><div id="content"></div></main></div>
<div class="modal" id="modal"><div class="dialog"><div class="dialoghead"><h2>Add transaction</h2><button onclick="hideAdd()">×</button></div><form id="txform"><label>Account<select id="account"></select></label><label>Date<input id="date" type="datetime-local" required></label><label>Description<input id="description" required></label><label>Amount<input id="amount" type="number" step="0.01" required><small>Use a negative amount for expenses.</small></label><label>Category<select id="category"><option value="">Uncategorized</option></select></label><label>Notes<textarea id="notes"></textarea></label><div class="actions"><button type="button" onclick="hideAdd()">Cancel</button><button class="primary" type="submit">Save transaction</button></div></form></div></div>
<script src="/static/app.js"></script></body></html>
