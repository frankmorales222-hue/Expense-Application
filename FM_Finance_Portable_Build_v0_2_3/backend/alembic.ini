# Alembic config for command-line use in development (run from the backend folder):
#   alembic upgrade sqlite@head
#   alembic upgrade postgresql@head
#   alembic revision --head sqlite@head -m "describe SQLite change"
# The database URL is read from .env by alembic/env.py, so no secrets live here.
# The packaged .exe runs migrations automatically on startup and does not use this file.

[alembic]
script_location = alembic
prepend_sys_path = .

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
